exclude: ^(data/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^docs/mkdocs\.yml$
      - id: check-yaml
        name: check mkdocs yaml
        files: ^docs/mkdocs\.yml$
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: "codespell (To apply suggested fixes, run: pipenv run codespell -w .)"
        args:
          [
            "-C",
            "0",
            "--skip=app/static/wikipedia_country_data.csv,app/static/flags/*,notebooks/Country_mentions.ipynb,notebooks/sentiment_tone_visualization.ipynb",
          ]
