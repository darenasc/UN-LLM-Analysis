[project]
name = "un_llm_analysis"
version = "3.0.0"
description = "Analysis of the UN noon briefings using LLMs."
authors = [
    { name = "Charles Mbayo", email = "c.mbayo80@gmail.com" },
    { name = "Daniel Wilkinson" },
    { name = "Diego Arenas", email = "darenasc@gmail.com" },
    { name = "Franz Song", email = "justsyh@gmail.com" },
    { name = "Josmy Mathew", email = "josmyrose@gmail.com" },
    { name = "Roxana Runcan", email = "runcanroxana@gmail.com" },
]
requires-python = "~=3.12.0"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
    { name = "Charles Mbayo", email = "c.mbayo80@gmail.com" },
    { name = "Daniel Wilkinson" },
    { name = "Diego Arenas", email = "darenasc@gmail.com" },
    { name = "Franz Song", email = "justsyh@gmail.com" },
    { name = "Josmy Mathew", email = "josmyrose@gmail.com" },
    { name = "Roxana Runcan", email = "runcanroxana@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "beautifulsoup4",
    "folium>=0.12",
    "geopandas",
    "ipywidgets",
    "jupyter",
    "loguru",
    "mapclassify",
    "markdown",
    "markdownify",
    "matplotlib",
    "mkdocs",
    "mlflow",
    "nltk",
    "numpy",
    "ollama",
    "openai",
    "pandas",
    "pandas-stubs",
    "pendulum",
    "playwright",
    "plotly",
    "python-dotenv",
    "scikit-learn",
    "sqlalchemy",
    "streamlit",
    "streamlit-folium",
    "wordcloud",
]

[project.scripts]
briefings = "un_llm_analysis.main:main"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "black",
    "curl-cffi",
    "ipython",
    "isort",
    "jupyterlab",
    "mkdocs-material",
    "mkdocs-panzoom-plugin",
    "mkdocstrings[python]",
    "notebook",
    "prek>=0.5.7",
    "pytest",
    "pytest-cov",
    "pytest-loguru",
    "pytest-mock",
]

[tool.uv]
package = true
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.black]
target-version = ["py312"]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["un_llm_analysis"]
force_sort_within_sections = true

[tool.pylint."MESSAGES CONTROL"]
disable = '''print-statement,
        redefined-outer-name,
        import-error'''

[tool.coverage.run]
# Which packages or paths to measure
source = ["un_llm_analysis"]
# Do not measure the tests themselves
omit = ["*/tests/*", "*/__main__.py", "*/migrations/*", "*/share/virtualenvs/*"]
# Needed when you combine data from subprocesses (xdist, multiprocessing)
parallel = true

[tool.coverage.report]
# Show missing line numbers in the terminal report
show_missing = true
# Do not list files that are already fully covered
skip_covered = false
# Round to whole percentages
precision = 0

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
ignore_missing_imports = true
